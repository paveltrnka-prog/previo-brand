<!--

<style>

body { width: 1080px; height: 1920px; background: var(--primary); color: #fff; font: 400 36px/50px var(--font); overflow: hidden; }
.frame { height: 100%; padding: 250px 88px 340px; display: flex; flex-direction: column; }
.logo svg { height: 56px; width: auto; display: block; }
.label { margin-top: auto; font: 500 28px/36px var(--font-medium); letter-spacing: .1em; text-transform: uppercase; opacity: .85; }

.sub { margin: 40px 0 0; max-width: 24ch; opacity: .92; }
.cta { margin-top: 72px; padding-top: 32px; border-top: 2px solid rgba(255,255,255,.4); font: 500 34px/44px var(--font-medium); }
</style>
</head>
<body>
<div class="frame">
  %%LOGO:white%%
