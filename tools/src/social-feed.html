<!doctype html>
<html lang="en"><!-- EDIT: set lang to the language of the content (e.g. cs) -->
<head>
<meta charset="utf-8">
<title>Previo social – feed 4:5</title>
<!--
  SOCIAL GRAPHIC – FEED (Instagram / Facebook / LinkedIn), 1080 × 1350 px.
  How to edit: replace the {{texts}}. Hero = the one big red number. Red signal: the topic label.
  The number must be real and verifiable. If you have no number, use the social-story template.
  Export to PNG: viewport 1080 × 1350, device scale 1 (or 2 for sharper output).
  Inter and the logo are embedded in this file.
  Replace the big number (e.g. 42 %) directly, without braces.
-->
<style>
/*%%FONTS%%*/
:root { --primary:#b50000; --ink:#202124; --muted:#515151; --border:#e5e5e5;
  --font:"Inter","Segoe UI",system-ui,sans-serif; --font-medium:"Inter Medium","Segoe UI",system-ui,sans-serif; }
@page { size: 1080px 1350px; margin: 0; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { width: 1080px; height: 1350px; background: #fff; color: var(--ink); font: 400 32px/44px var(--font); overflow: hidden; }
.frame { height: 100%; padding: 88px 88px 80px; display: flex; flex-direction: column; }
.top { display: flex; justify-content: space-between; align-items: center; }
.logo svg { height: 48px; width: auto; display: block; }
.label { font: 500 24px/32px var(--font-medium); letter-spacing: .1em; text-transform: uppercase; color: var(--primary); }
.num { margin-top: auto; font: 500 300px/280px var(--font-medium); letter-spacing: -.05em; color: var(--primary); }
.num small { font-size: 150px; letter-spacing: -.02em; }
h1 { font: 500 68px/76px var(--font-medium); letter-spacing: -.015em; margin: 40px 0 0; max-width: 17ch; }
.sub { margin: 28px 0 0; color: var(--muted); max-width: 30ch; }
.foot { margin-top: 64px; padding-top: 28px; border-top: 2px solid var(--border); display: flex; justify-content: space-between; font-size: 26px; color: var(--muted); }
.foot b { font: 500 26px/44px var(--font-medium); color: var(--ink); }
</style>
</head>
<body>
<div class="frame">
  <div class="top">%%LOGO:color%%<span class="label">{{Topic}}</span></div>
  <div class="num">42<small>%</small></div>
  <h1>{{What the figure means, in one sentence}}</h1>
  <p class="sub">{{Source or detail: period, sample.}}</p>
  <div class="foot"><b>{{Call to action, e.g. Learn more}}</b><span>{{previo.cz}}</span></div>
</div>
</body>
</html>
